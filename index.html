<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Streams en direct</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box !important;
    }

    body {
      background-color: transparent;
      color: black;
      font-family: 'Inter', sans-serif;
      padding: 20px;
      margin: 0;
    }

    /* En-tête / Bouton Retour */
    header {
      padding: 10px 0 20px 0;
      text-align: left;
    }

    .btn-retour {
      display: inline-block;
      background: #ffffff;
      color: black;
      padding: 10px 22px;
      border-radius: 12px;
      border: 2px solid black;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 4px 4px 0px black;
      transition: all 0.1s ease;
    }

    .btn-retour:hover {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px black;
    }

    h1 {
      color: black;
      text-align: center;
      font-size: 2rem;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 30px;
      letter-spacing: -0.5px;
    }

    /* Structure Grid alignée sur la largeur fixe des cartes (380px + marge) */
    .stream-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(390px, 1fr));
      gap: 35px 30px;
      justify-items: center;
      width: 100%;
      max-width: 1700px;
      margin: 0 auto;
    }

    /* Wrapper pour l'effet Néo-Brutalisme */
    .stream-card-wrapper {
      position: relative !important;
      width: 380px;
    }

    .rectangle-neobrut {
      position: absolute !important;
      top: 10px;
      left: 10px;
      width: 100%;
      height: 100%;
      background-color: #F53D3D !important;
      border: 2px solid black;
      border-radius: 15px;
      z-index: 1 !important;
    }

    .stream {
      position: relative !important;
      z-index: 2 !important;
      background: #ffffff;
      border: 2px solid black;
      border-radius: 15px;
      overflow: hidden;
      width: 100%;
    }

    iframe {
      display: block;
      width: 100% !important;
      height: 214px !important; /* Hauteur fixe 16:9 pour 380px de large */
      border: none;
      border-bottom: 2px solid black;
    }

    /* Transparence si hors ligne */
    .stream-card-wrapper.offline {
      opacity: 0.55;
    }

    .stream-name {
      text-align: center;
      padding: 12px 15px;
      background: #ffffff;
      color: black;
      font-weight: 700;
      font-size: 15px;
    }

    /* Adaptabilité mobile */
    @media (max-width: 420px) {
      .stream-container {
        grid-template-columns: 1fr;
      }
      .stream-card-wrapper {
        width: 100%;
      }
      iframe {
        height: 200px !important;
      }
    }
  </style>
</head>
<body>

  <header>
    <div>
      <a href="https://pipouchaosland.fr/" class="btn-retour">
        ← Retour
      </a>
    </div>
  </header>

  <h1>Streams en direct</h1>
  
  <div class="stream-container" id="streams"></div>

  <script>
  const channels = [
    "shiharuru_", "aidenhakazuki", "aiglefins",
    "suneetoo", "shouyuhikaru", "karnillia",
    "komori_kyo", "rorogemini", "shio_ryuo", "taku_vtuber",
    "lebaron_seras", "nozomiexploratrice", "kichi_chii", "seedity"
  ];

  const clientId = '1mpsdeq06om5kmeq4trbv1hnjuo3uw';

  async function getToken() {
    const res = await fetch("https://twitch-token-api.vercel.app/api/token");
    const data = await res.json();
    return data.access_token;
  }

  async function fetchStreams(token) {
    const headers = {
      'Client-ID': clientId,
      'Authorization': `Bearer ${token}`
    };

    const res = await fetch(`https://api.twitch.tv/helix/streams?user_login=${channels.join('&user_login=')}`, { headers });
    const data = await res.json();
    return data.data;
  }

  function createStream(channel, online) {
    const wrapper = document.createElement('div');
    wrapper.className = `stream-card-wrapper${online ? '' : ' offline'}`;
    
    wrapper.innerHTML = `
      <div class="rectangle-neobrut"></div>
      <div class="stream">
        <iframe src="https://player.twitch.tv/?channel=${channel}&parent=live.pipouchaosland.fr" allowfullscreen></iframe>
        <div class="stream-name">${channel}${online ? '' : ' (hors ligne)'}</div>
      </div>
    `;
    return wrapper;
  }

  async function displayStreams() {
    const token = await getToken();
    const onlineStreams = await fetchStreams(token);
    const onlineChannels = onlineStreams.map(s => s.user_login);

    const container = document.getElementById('streams');

    // Streams en ligne
    onlineChannels.forEach(channel => {
      container.appendChild(createStream(channel, true));
    });

    // Streams hors ligne
    channels.filter(c => !onlineChannels.includes(c)).forEach(channel => {
      container.appendChild(createStream(channel, false));
    });
  }

  displayStreams();
  </script>
</body>
</html>
